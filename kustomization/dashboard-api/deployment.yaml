apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api-deployment
spec:
  selector:
    matchLabels:
      app: dashboard-api
  replicas: 1
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      serviceAccountName: dashboard-api-pod-read
      containers:
      # Main dashboard API pod
      - name: dashboard-api
        image: hub.opensciencegrid.org/mwestphall/personal-ap-dashboard-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        # LDAP configuration
        - name: LDAP_SERVER
          value: "ldap://ldap-service.default.svc.cluster.local:1389"
        - name: LDAP_USER
          value: "cn=admin,dc=chtc,dc=wisc,dc=edu"
        - name: LDAP_AUTHTOK
          value: "admin"
        - name: LDAP_CERT
          value: ""
        - name: LDAP_GROUP
          value: "foo"

        # Local DB configuration
        - name: DASHBOARD_DB_PATH
          value: "sqlite:////tmp/dashboard.db"

        # Email configuration
        - name: SEND_EMAILS
          value: "false"
        - name: FROM_ADDRESS
          value: chtc-infrastructure@g-groups.wisc.edu
        - name: TO_ADDRESS
          value: westphall@wisc.edu
        - name: SMTP_HOST
          value: smtp.wiscmail.wisc.edu 
      # Connection broker for scheduled jobs
      - name: rabbitmq
        image: rabbitmq
        ports:
        - containerPort: 5672
