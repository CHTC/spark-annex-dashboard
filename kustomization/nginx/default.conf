resolver kube-dns.kube-system.svc.cluster.local valid=30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;

    location /api/ {
        proxy_pass_request_headers on;
        proxy_pass http://dashboard-api-service.default.svc.cluster.local:80/;
    }

    location / {
        proxy_pass http://dashboard-ui-service.default.svc.cluster.local:80;
    }

    location ~ ^/dashboards/([^/]*)/(.*)$ {
        set $netid $1;
        set $path $2;
        proxy_pass http://$netid-personal-ap.default.svc.cluster.local:8888/dashboards/$netid/$path;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # websocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Scheme $scheme;

        proxy_buffering off;
    }
}
