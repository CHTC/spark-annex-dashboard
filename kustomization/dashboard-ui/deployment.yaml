apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-ui-deployment
spec:
  selector:
    matchLabels:
      app: dashboard-ui
  replicas: 1
  template:
    metadata:
      labels:
        app: dashboard-ui
    spec:
      containers:
      - name: dashboard-ui
        image: hub.opensciencegrid.org/mwestphall/personal-ap-dashboard-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
